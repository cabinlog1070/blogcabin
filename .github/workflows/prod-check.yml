# 읽기 전용 운영 점검: 서버 nginx가 손님을 8440·8441 둘 다로 보내는지 본다. 아무것도 바꾸지 않는다.
name: prod-check
on:
  push:
    branches: [chore/prod-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
      SSH_HOST: ${{ secrets.SSH_ADDRESS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_ID }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: send requests, then count which app port each one went to
        run: |
          set +e
          echo "== 20 requests from the internet"
          for i in $(seq 1 20); do curl -s -o /dev/null -m 10 -w '%{http_code} ' https://blogcabin.java21.net/api/health; done; echo
          sshpass -e ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 ${SSH_USER}@${SSH_HOST} 'bash -s' <<'SH'
          set +e
          echo "== now"; date
          echo "== 20 requests through server nginx on this machine"
          for i in $(seq 1 20); do curl -sk -o /dev/null -m 8 -w '%{http_code} ' --resolve blogcabin.java21.net:443:127.0.0.1 https://blogcabin.java21.net/api/health; done; echo
          echo "== recent connections from nginx, by app port (TIME_WAIT lasts ~60s)"
          ss -tan state time-wait | awk '{print $NF}' | grep -E '127\.0\.0\.1:844[01]$' | sort | uniq -c
          SH
          true
