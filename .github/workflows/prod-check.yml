# 읽기 전용 운영 점검: 서버 nginx를 누가·언제 다시 읽는지(reload) 단서를 찾는다. 아무것도 바꾸지 않는다.
name: prod-check
on:
  push:
    branches: [chore/prod-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
      SSH_HOST: ${{ secrets.SSH_ADDRESS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_ID }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: when did server nginx last reload (read only)
        run: |
          sshpass -e ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 ${SSH_USER}@${SSH_HOST} 'bash -s' <<'SH'
          set +e
          echo "== now"; date
          echo "== server nginx (/usr/sbin/nginx) master and worker start times"
          for pid in $(pgrep -f '^nginx: master process /usr/sbin/nginx'); do
            echo "master $pid $(ps -o lstart= -p $pid)"
            ps -eo ppid,lstart | awk -v p="$pid" '$1==p {$1=""; print "worker" $0}' | sort | uniq -c
          done
          echo "== our home and ~/nginx path"; echo "$HOME"; readlink -f ~/nginx
          echo "== other accounts' nginx files changed in the last 3 hours (names hidden)"
          base=$(dirname "$HOME"); find "$base"/*/nginx -maxdepth 1 -name '*.conf' -mmin -180 -printf '%TY-%Tm-%Td %TH:%TM:%.2TS\n' 2>/dev/null | sort
          echo "count of readable nginx dirs: $(ls -d "$base"/*/nginx 2>/dev/null | wc -l)"
          SH
