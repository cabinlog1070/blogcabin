# 읽기 전용 운영 점검: 서버 nginx가 바뀐 설정을 다시 읽었는지(reload) 보고, 손님이 8440·8441 둘 다로 가는지 본다. 아무것도 바꾸지 않는다.
name: prod-check
on:
  push:
    branches: [chore/prod-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
      SSH_HOST: ${{ secrets.SSH_ADDRESS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_ID }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Server (read only)
        run: |
          sshpass -e ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 ${SSH_USER}@${SSH_HOST} 'bash -s' <<'SH'
          set +e
          echo "== now"; date
          echo "== our nginx file changed at"; stat -c '%y' ~/nginx/blogcabin.java21.net.conf
          echo "== nginx master / worker start times (reload restarts workers)"; ps -eo lstart,args | grep -E 'nginx: (master|worker)' | grep -v grep | sort | uniq -c | head -8
          echo "== connections to our apps before"; ss -tan | grep -E '127\.0\.0\.1:844[01]\b' | awk '{print $1, $4, $5}' | sort | uniq -c
          echo "== 30 requests through https"; for i in $(seq 1 30); do curl -s -o /dev/null -m 10 -w '%{http_code} ' https://blogcabin.java21.net/api/health; done; echo
          echo "== connections to our apps after (TIME_WAIT shows which ports got requests)"; ss -tan | grep -E '127\.0\.0\.1:844[01]\b' | awk '{print $1, $4, $5}' | sed -E 's/:[0-9]+ / /' | sort | uniq -c
          SH
