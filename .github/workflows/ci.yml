# PR마다 도는 검사. 화면(frontend/)과 서버(backend/)를 따로 검사한다.
# 바뀐 폴더와 상관없이 둘 다 돈다 (한쪽만 고쳐도 다른 쪽이 깨지지 않았는지 같이 본다).
# 문서(*.md)만 바꾼 PR은 돌지 않는다.
name: CI

on:
  pull_request:
    branches: [develop, main]
    paths-ignore: ["**/*.md"]
  push:
    branches: [develop]
    paths-ignore: ["**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: 화면 (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: 타입 검사
        run: npx next typegen && npx tsc --noEmit
      - name: 린트
        run: npx eslint
      - name: 테스트 (게임 규칙·상점·번역 사전 등)
        run: npm test

  backend:
    name: 서버 (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: 타입 검사
        run: npm run typecheck
      - name: 빌드
        run: npm run build
