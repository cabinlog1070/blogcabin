# main에 올리면(또는 Actions 화면에서 직접 실행하면) Docker 이미지를 만들어 서버에 배포한다.
# 1) 서버 CPU 종류를 보고 그에 맞는 이미지를 빌드 → 2) 이미지 파일을 SSH로 서버에 보냄 → 3) 서버에서 deploy/deploy.sh 실행
#
# 필요한 저장소 시크릿 (Settings > Secrets and variables > Actions)
#   SSH_ADDRESS, SSH_PORT, SSH_ID, SSH_PASSWORD  : 배포 서버 SSH 접속 정보 (비밀번호 방식)
#   DB_ADDRESS, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD : 운영 PostgreSQL 접속 정보
# 선택 시크릿
#   APP_URL          : 사용자가 여는 사이트 주소 (예: https://blogcabin.example.com). 없으면 http://SSH_ADDRESS:8440
#   TRUSTED_ORIGINS  : APP_URL 말고도 접속을 허용할 주소들 (쉼표로 구분)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET, KAKAO_CLIENT_ID / KAKAO_CLIENT_SECRET, NAVER_CLIENT_ID / NAVER_CLIENT_SECRET
#   DB_SSLMODE       : 관리형 DB가 SSL을 요구하면 verify-full 등 (없으면 붙이지 않음)
# 로그인 비밀키(BETTER_AUTH_SECRET)와 관리자 비밀번호(ADMIN_PASSWORD)는 서버가 첫 배포 때 만들어
# ~/blogcabin/secrets.env 에 보관한다 (deploy/deploy.sh).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않게 한 번에 하나씩
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_PORT: "8440"
      IMAGE: blogcabin
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
      SSH_HOST: ${{ secrets.SSH_ADDRESS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Check server (CPU, Docker)
        id: server
        run: |
          set -euo pipefail
          SSH="sshpass -e ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 ${SSH_USER}@${SSH_HOST}"
          ARCH=$($SSH 'uname -m')
          case "$ARCH" in
            x86_64|amd64) echo "platform=linux/amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64|arm64) echo "platform=linux/arm64" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::지원하지 않는 서버 CPU: $ARCH"; exit 1 ;;
          esac
          if ! $SSH 'docker version >/dev/null 2>&1 || sudo -n docker version >/dev/null 2>&1'; then
            echo "::error::서버에서 docker를 쓸 수 없어요. Docker를 설치하고 ${SSH_USER} 계정을 docker 그룹에 넣거나 비밀번호 없는 sudo를 허용해 주세요."
            exit 1
          fi
          echo "서버 CPU: $ARCH"

      - name: Set up QEMU (ARM 서버용)
        if: steps.server.outputs.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker buildx build \
            --platform "${{ steps.server.outputs.platform }}" \
            --tag "$IMAGE:$TAG" \
            --load .
          docker save "$IMAGE:$TAG" | gzip -1 > image.tar.gz
          ls -lh image.tar.gz

      - name: Prepare server env file
        env:
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
          APP_URL: ${{ secrets.APP_URL }}
          TRUSTED_ORIGINS: ${{ secrets.TRUSTED_ORIGINS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          # 비밀번호에 @ : / 같은 글자가 있어도 깨지지 않게 주소용으로 인코딩해서 DATABASE_URL을 만든다
          node > deploy.env <<'JS'
          const e = process.env;
          const enc = encodeURIComponent;
          let url = `postgres://${enc(e.DB_USERNAME)}:${enc(e.DB_PASSWORD)}@${e.DB_ADDRESS}:${e.DB_PORT || 5432}/${enc(e.DB_NAME)}`;
          if (e.DB_SSLMODE) url += `?sslmode=${enc(e.DB_SSLMODE)}`;
          const appUrl = (e.APP_URL || `http://${e.SSH_HOST}:${e.APP_PORT}`).replace(/\/+$/, "");
          const lines = {
            DATABASE_URL: url,
            DB_HOST: e.DB_ADDRESS,
            BETTER_AUTH_URL: appUrl,
            TRUSTED_ORIGINS: e.TRUSTED_ORIGINS || "",
            GOOGLE_CLIENT_ID: e.GOOGLE_CLIENT_ID || "",
            GOOGLE_CLIENT_SECRET: e.GOOGLE_CLIENT_SECRET || "",
            KAKAO_CLIENT_ID: e.KAKAO_CLIENT_ID || "",
            KAKAO_CLIENT_SECRET: e.KAKAO_CLIENT_SECRET || "",
            NAVER_CLIENT_ID: e.NAVER_CLIENT_ID || "",
            NAVER_CLIENT_SECRET: e.NAVER_CLIENT_SECRET || "",
          };
          for (const [k, v] of Object.entries(lines)) {
            if (/[\r\n]/.test(v)) throw new Error(`${k}에 줄바꿈이 있어요`);
            console.log(`${k}=${v}`);
          }
          JS
          echo "BETTER_AUTH_URL: $(grep '^BETTER_AUTH_URL=' deploy.env | cut -d= -f2-)"

      - name: Upload to server
        run: |
          set -euo pipefail
          SSH="sshpass -e ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new ${SSH_USER}@${SSH_HOST}"
          $SSH 'mkdir -p ~/blogcabin/releases && chmod 700 ~/blogcabin'
          sshpass -e scp -P "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            image.tar.gz deploy.env deploy/deploy.sh \
            "${SSH_USER}@${SSH_HOST}:blogcabin/releases/"

      - name: Run on server
        run: |
          set -euo pipefail
          sshpass -e ssh -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" \
            "bash ~/blogcabin/releases/deploy.sh '$IMAGE:$TAG' ~/blogcabin/releases/image.tar.gz ~/blogcabin/releases/deploy.env $APP_PORT"

      - name: Clean up
        if: always()
        run: rm -f deploy.env image.tar.gz
